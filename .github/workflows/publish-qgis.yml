name: Publier sur plugins.qgis.org

# Se declenche a chaque tag vX.Y.Z pousse sur le depot (cf. tools/publish.py).
# Les identifiants OSGeo sont lus dans les secrets du depot (Settings > Secrets
# and variables > Actions) : OSGEO_USER et OSGEO_PASSWORD. Ils ne transitent
# jamais en clair dans les journaux.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    # Fige plutot que ubuntu-latest, qui bascule sur Ubuntu 26 le 19/10/2026 :
    # une publication ne doit pas changer d'environnement sans qu'on le decide.
    runs-on: ubuntu-24.04
    # Ecriture necessaire pour creer la release GitHub en fin de job.
    permissions:
      contents: write
    steps:
      # v7 : actions sous Node.js 24 (Node 20 est deprecie sur les runners).
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les controles de prepublication
        run: pip install bandit detect-secrets

      - name: Construire le ZIP (meme perimetre que le depot)
        id: build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          python tools/build_zip.py --out "$GITHUB_WORKSPACE/dist"
          echo "zip=$(ls "$GITHUB_WORKSPACE"/dist/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Extraire le ZIP pour le controle (perimetre reellement envoye)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan"
          unzip -q "${{ steps.build.outputs.zip }}" -d "$GITHUB_WORKSPACE/scan"

      - name: Bandit (bloquant sur plugins.qgis.org)
        run: bandit -r "$GITHUB_WORKSPACE/scan" -q

      - name: detect-secrets (bloquant sur plugins.qgis.org)
        run: |
          detect-secrets scan "$GITHUB_WORKSPACE/scan" --all-files > /tmp/secrets.json
          python -c "import json,sys; sys.exit(1 if json.load(open('/tmp/secrets.json'))['results'] else 0)"

      - name: Verifier que le tag correspond a metadata.txt
        run: |
          version=$(grep '^version=' metadata.txt | cut -d= -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas a version=$version dans metadata.txt"
            exit 1
          fi

      - name: Publier sur plugins.qgis.org
        env:
          OSGEO_USER: ${{ secrets.OSGEO_USER }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: python tools/publish.py --zip "${{ steps.build.outputs.zip }}"

      # Apres l'envoi seulement : la release ne devient « Latest » que si la
      # version est bien partie sur plugins.qgis.org. Notes = section du
      # CHANGELOG, a defaut celles generees par GitHub ; le ZIP est joint.
      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/release_notes.py "$version" --out /tmp/notes.md
          titre=$(git log -1 --format=%s)
          case "$titre" in "$version - "*) ;; *) titre="$version" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          elif [ -s /tmp/notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --latest               --title "$titre" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --latest               --title "$titre" --generate-notes
          fi
